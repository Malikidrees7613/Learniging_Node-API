<!DOCTYPE html>
 <html lang="en">
 <head>
 <meta charset="utf-8"/>
 <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
 <title>Active Sessions - AuthPro</title>
 <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet"/>
 <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
 <script>
     tailwind.config = {
         theme: { extend: { colors: {
             primary: "#3525cd",
             "primary-container": "#4f46e5",
             "on-surface": "#191c1e",
             "on-surface-variant": "#464555",
             "outline-variant": "#c7c4d8",
             background: "#f7f9fb",
             "surface-container-lowest": "#ffffff",
             "surface-container-low": "#f2f4f6",
             "surface-container": "#eceef0",
             "surface-container-high": "#e6e8ea",
             "on-primary": "#ffffff",
             error: "#ba1a1a"
         } } }
     };
 </script>
 </head>
 <body class="bg-background text-on-surface font-body-md min-h-screen antialiased">
 <div class="max-w-2xl mx-auto px-5 md:px-8 py-10">
     <div class="flex items-center justify-between mb-8">
         <span class="font-bold text-xl text-primary flex items-center gap-2">
             <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">devices</span>
             Active Sessions
         </span>
         <div class="flex gap-2">
             <button onclick="logoutAll()" class="px-3 py-2 rounded bg-surface-container-high text-on-surface text-sm font-medium border border-outline-variant
 hover:bg-surface-container">Log out all</button>
             <button onclick="logoutCurrent()" class="px-3 py-2 rounded bg-primary text-on-primary text-sm font-medium hover:bg-primary-container">Log out this
 device</button>
         </div>
     </div>

     <p id="status" class="text-on-surface-variant mb-6"></p>
     <div id="sessionList" class="space-y-3"></div>
 </div>

 <script>
     const token = localStorage.getItem('token');
     if (!token) window.location.href = '/signIn.html';

     const api = (url, options = {}) =>
         fetch(url, {
             ...options,
             headers: {
                 'Content-Type': 'application/json',
                 'Authorization': `Bearer ${token}`,
                 ...(options.headers || {})
             }
         });

     function decodeToken(tok) {
         const base64 = tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
         return JSON.parse(atob(base64));
     }

     function currentSessionId() {
         try { return decodeToken(token).sessionId; } catch (e) { return null; }
     }

     function escapeHtml(str) {
         const div = document.createElement('div');
         div.textContent = str;
         return div.innerHTML;
     }

     function when(d) { return d ? new Date(d).toLocaleString() : '—'; }

     function sessionCard(s) {
         const isCurrent = s._id === currentSessionId();
         const div = document.createElement('div');
         div.className = 'bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-start justify-between gap-4';
         div.innerHTML = `
             <div class="flex items-start gap-3">
                 <span class="material-symbols-outlined text-primary mt-1">${isCurrent ? 'desktop_windows' : 'devices_other'}</span>
                 <div>
                     <p class="font-medium">${escapeHtml(s.device || 'Unknown device')}${isCurrent ? ' <span class="text-xs text-primary">(this device)</span>' : ''}</p>     
                     <p class="text-sm text-on-surface-variant">${escapeHtml(s.ipAddress || 'Unknown IP')} · Signed in ${when(s.createdAt)}</p>
                     <p class="text-sm text-on-surface-variant">Last active ${when(s.lastActivityAt)}</p>
                 </div>
             </div>
             ${isCurrent ? '' : `<button onclick="revokeSession('${s._id}')" class="text-error text-sm font-medium hover:underline">Log out</button>`}
         `;
         return div;
     }

     async function loadSessions() {
         const list = document.getElementById('sessionList');
         const status = document.getElementById('status');
         try {
             const res = await api('/api/sessions');
             if (res.status === 401) { localStorage.removeItem('token'); window.location.href = '/signIn.html'; return; }
             const data = await res.json();
             if (!res.ok) { status.textContent = data.message || 'Failed to load sessions'; return; }
             status.textContent = `${data.sessions.length} active session(s)`;
             list.innerHTML = '';
             data.sessions.forEach(s => list.appendChild(sessionCard(s)));
         } catch (err) {
             status.textContent = 'Error loading sessions';
             console.error(err);
         }
     }

     async function revokeSession(id) {
         const res = await api(`/api/sessions/${id}`, { method: 'DELETE' });
         const data = await res.json();
         alert(data.message || 'Done');
         if (res.ok) loadSessions();
     }

     async function logoutAll() {
         if (!confirm('Log out from all devices?')) return;
         await api('/api/sessions/logout-all', { method: 'POST' });
         localStorage.removeItem('token');
         window.location.href = '/signIn.html';
     }

     async function logoutCurrent() {
         await api('/api/auth/logout', { method: 'POST' });
         localStorage.removeItem('token');
         window.location.href = '/signIn.html';
     }

     loadSessions();
 </script>
 </body>
 </html>
